version: 1.0
runtime: python3
build:
  commands:
    build:
      - pip install -r requirements.txt
      - python manage.py collectstatic --noinput
run:
  runtime-version: 3.12
  command: sh -c "python manage.py migrate && gunicorn backend.wsgi:application --bind 0.0.0.0:8000 --timeout 300 --workers 3 --threads 3 --worker-class gthread"
  network:
    port: 8000
    env:
      - DJANGO_SECRET_KEY
      - DATABASE_URL
      - PGDATABASE
      - PGUSER
      - PGPASSWORD
      - PGHOST
      - PGPORT
      - ALLOWED_HOSTS
      - CORS_ALLOWED_ORIGINS
      - CORS_ALLOW_ALL_ORIGINS
      - CORS_ALLOWS_CREDENTIALS
      - REDIS_URL
      - DEBUG 